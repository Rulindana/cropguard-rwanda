<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CropGuard AI - Post-Harvest Risk Monitoring for Rwanda">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CropGuard AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Circular favicon via SVG wrapper -->
  <link rel="icon" type="image/svg+xml" href="favicon_circle.svg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>CropGuard AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0B1617;
    }

    #flutter-app-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* ── Instant splash screen shown before Flutter boots ── */
    #splash {
      position: fixed;
      inset: 0;
      background: #0B1617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00C853, #00E676);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 40px rgba(0, 230, 118, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    #splash-title {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #splash-sub {
      color: rgba(255,255,255,0.45);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      margin-top: -16px;
    }

    /* Spinner ring */
    #splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: #00E676;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 230, 118, 0.3); }
      50%       { box-shadow: 0 0 55px rgba(0, 230, 118, 0.6); }
    }
  </style>
</head>
<body>

  <!-- ✅ Instant splash: visible immediately while Flutter JS downloads & parses -->
  <div id="splash">
    <img id="splash-logo-img" src="assets/assets/icon/logo.png"
         onerror="this.style.display='none';document.getElementById('splash-logo-fallback').style.display='flex';"
         style="width:90px;height:90px;border-radius:22px;box-shadow:0 0 40px rgba(0,230,118,0.45);animation:pulse 2s ease-in-out infinite;object-fit:cover;" />
    <div id="splash-logo-fallback"
         style="display:none;width:90px;height:90px;border-radius:22px;background:linear-gradient(135deg,#00C853,#00E676);align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(0,230,118,0.4);animation:pulse 2s ease-in-out infinite;">🌾</div>
    <div id="splash-title">CropGuard AI</div>
    <div id="splash-sub">Post-Harvest Risk Monitoring · Rwanda</div>
    <div id="splash-spinner"></div>
    <!-- Powered by NISR at bottom of splash -->
    <div style="position:fixed;bottom:20px;left:0;right:0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.5px;">
      Powered by <a href="https://statistics.gov.rw" target="_blank" rel="noopener"
        style="color:rgba(0,230,118,0.7);text-decoration:none;font-weight:600;">NISR</a>
      &nbsp;·&nbsp; statistics.gov.rw
    </div>
  </div>

  <div id="flutter-app-container"></div>

  <!-- NISR Powered By Footer (Web Only) -->
  <div id="nisr-footer" style="
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, rgba(11,22,37,0) 0%, rgba(11,22,37,0.95) 30%, rgba(11,22,37,1) 100%);
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    letter-spacing: 0.5px;
    border-top: 1px solid rgba(0,230,118,0.15);
  ">
    <span style="opacity:0.6;">Powered by</span>
    <a href="https://statistics.gov.rw" target="_blank" rel="noopener noreferrer"
       style="color:rgba(0,230,118,0.8);text-decoration:none;font-weight:600;font-size:11px;"
       onmouseover="this.style.color='#00E676'"
       onmouseout="this.style.color='rgba(0,230,118,0.8)'">
      NISR
    </a>
    <span style="opacity:0.4;">|</span>
    <a href="https://statistics.gov.rw" target="_blank" rel="noopener noreferrer"
       style="color:rgba(255,255,255,0.35);text-decoration:none;font-size:10px;"
       onmouseover="this.style.color='rgba(255,255,255,0.7)'"
       onmouseout="this.style.color='rgba(255,255,255,0.35)'">
      statistics.gov.rw
    </a>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Force-clear old service worker and caches on every load ──
    // This ensures users always get the latest deployed version.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    // Clear all browser caches
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) { caches.delete(name); }
      });
    }

    // Hide the splash once Flutter signals it's ready
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() { if (splash.parentNode) splash.remove(); }, 500);
      }
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    // ✅ Force-hide after 4s max — never leave user staring at splash
    setTimeout(hideSplash, 4000);
  </script>
</body>
</html>
