name: cropguard_app
description: CropGuard AI - Post-harvest risk monitoring for Rwanda farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.2.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  fl_chart: ^0.68.0
  uuid: ^4.5.1

  # HTTP for direct API calls (fallback)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
